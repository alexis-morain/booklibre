[workspace]
resolver = "2"
members = ["crates/colophon-core", "crates/colophon-cli", "crates/colophon-app/src-tauri"]

[workspace.package]
version = "1.2.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/alexis-morain/booklibre"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
image_hasher = "3.1"
kamadak-exif = "0.5"
lopdf = "0.42"
rayon = "1"
rustface = "0.1.7"
serde = { version = "1", features = ["derive"] }
# float_roundtrip : sans lui, serde_json relit un f64 à un ULP près, et les
# fiches ne rendent pas ce qu'elles ont mesuré. Un point focal recomposé
# depuis un relevé s'écrivait alors 0.395 là où la lecture des photos avait
# écrit 0.39499999999999996, et l'identité des deux chemins tombait sur
# dix-huit lignes d'album.json.
serde_json = { version = "1", features = ["float_roundtrip"] }
walkdir = "2"
# La commande chez Cloudprinter et le dépôt S3 (K-s2). Synchrones et sans
# tokio : le moteur n'a pas d'exécuteur, et `reqwest` n'est dans l'arbre que
# pour l'updater de l'app. TLS par rustls et les racines de webpki-roots,
# rien d'OpenSSL. Licences auditées avant la première ligne, arbre compris.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
rusty-s3 = { version = "0.10", default-features = false, features = ["rustcrypto"] }
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }

[profile.release]
opt-level = 3

# Le gate tourne en debug (`cargo test`), et la composition d'un album décode,
# redimensionne et réencode des images, puis écrit du PDF : sans optimisation,
# la suite de colophon-core prenait 31 min sous Windows (1 856 s, #141) et le
# job frôlait son délai de 45 min. Les dépendances (image, zune-jpeg, lopdf,
# flate2…) sont compilées en opt-level 2 ; colophon-core en opt-level 1.
# `debug-assertions` et `overflow-checks` restent actifs pour nos crates : seul
# le niveau d'optimisation change, pas ce que les tests vérifient.
# `tauri dev` fixe déjà CARGO_PROFILE_DEV_OPT_LEVEL=3 par l'environnement, qui
# l'emporte sur ce qui suit pour le profil dev du paquet racine.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.colophon-core]
opt-level = 1
